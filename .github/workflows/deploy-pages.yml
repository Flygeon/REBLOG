# GitHub Pages 分站部署（根域 https://flygeon.github.io/）
# GitHub 根域只认 <user>.github.io 特殊仓库，因此产物发布到
# Flygeon/Flygeon.github.io 的 gh-pages 分支（由 peaceiris action 推送）。
# 主站仍在 Cloudflare Workers（flygeon.top）。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-mirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段决定

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 完整 SSG 管线：客户端构建 → SSR 构建 → 预渲染 → sitemap/rss
      # 根域部署无需子路径 base（app.ts 的 BASE_URL 默认 "/"）
      - run: pnpm build:ssg

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: Flygeon/Flygeon.github.io
          publish_branch: gh-pages
          publish_dir: dist
          force_orphan: true
